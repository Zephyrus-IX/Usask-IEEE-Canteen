services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-canteen}
      POSTGRES_USER: ${POSTGRES_USER:-canteen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-canteen} -d ${POSTGRES_DB:-canteen}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    restart: unless-stopped
    command:
      - gunicorn
      - canteen_project.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=2
      - --timeout=30
      - --access-logfile=-
      - --error-logfile=-
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    expose:
      - "8000"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

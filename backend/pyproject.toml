[project]
name = "usask-ieee-canteen"
version = "0.1.0"
description = "Self-hosted canteen/POS app for Usask IEEE"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6.0",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "canteen_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

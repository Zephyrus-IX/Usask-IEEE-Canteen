{% extends "canteen/base.html" %}

{% block title %}Load Account Balance · Usask IEEE Canteen{% endblock %}

{% block content %}
  <section class="page-panel">
    <h1>Load Account Balance</h1>
    <p class="muted">Record a cash or card prepayment onto an account.</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Load balance</button>
    </form>
  </section>
{% endblock %}
